<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>CloClo</title>
<style>
  :root{
    --body1:#6b2b26; --body2:#3c1512; --metal1:#e6c476; --metal2:#c9a24b; --metal3:#8a6a2f;
    --face:#ede3ce; --ink:#241e1a; --highlight:#f3d78b; --sweater:#b0483d;
  }
  html, body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    -webkit-user-select:none; user-select:none;
    font-family:'Segoe UI', sans-serif;
  }
  #stage{
    width:150px; height:270px; position:relative; box-sizing:border-box;
    padding-bottom:62px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:grab;
    /* Scales the whole thing uniformly — every rule below still targets the
       original 150x270 canvas unchanged; only the window (MainWindow.xaml)
       and the click hit-rects (MainWindow.xaml.cs) need to know about this
       factor, since those live outside what CSS can reach. */
    zoom:1.3;
    /* Dims a touch once asleep (see #zzz below) — a resting cue that
       reads even out of the corner of your eye, not just the face
       changing. Transition lives here so it eases both ways. */
    transition:opacity .6s ease;
  }
  body.sleeping #stage{ opacity:.85; }
  #stage:active{ cursor:grabbing; }
  #sparkle{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #keeperWrap{ animation:breathe 3.2s ease-in-out infinite; transform-origin:50% 100%; }
  @keyframes breathe{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }
  /* Slower, deeper breathing while asleep — same keyframes, just stretched. */
  body.sleeping #keeperWrap{ animation-duration:5.5s; }
  /* Faster, energetic breathing while in the workout pose — same
     keyframes, just squeezed, the mirror of the sleepy slow-down above. */
  body.working-out #keeperWrap{ animation-duration:1.6s; }
  body.sky-windy #keeperWrap{ animation:windSway 2.2s ease-in-out infinite; }
  @keyframes windSway{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    30%{ transform:translateY(-2px) rotate(-4deg); }
    65%{ transform:translateY(-3px) rotate(2.5deg); }
  }

  /* A one-shot "noticed that" bounce the instant Watch() starts (see
     PushPerk in MainWindow.xaml.cs) — ties Keeper's posture to the same
     click that's about to start updating the label, rather than the label
     being the only sign anything happened. Overrides the ambient
     breathe/windSway animation on #keeperWrap for its own short duration,
     then the JS removes the class and the ambient one resumes on its own. */
  @keyframes perkUp{
    0%{ transform:translateY(0) scale(1); }
    30%{ transform:translateY(-6px) scale(1.04); }
    60%{ transform:translateY(-2px) scale(1.01); }
    100%{ transform:translateY(0) scale(1); }
  }
  #keeperWrap.perk{ animation:perkUp .5s ease-out; }

  /* Idle fidgets — a small pool of rare, random micro-animations while
     genuinely just standing there (awake, not asleep or mid-stretch), same
     spirit as blinking: charm, not signal. One of these plays at a time,
     picked and scheduled from the script below. */
  @keyframes fidgetLean{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(-2deg); } }
  @keyframes fidgetSquish{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(.97); } }
  @keyframes fidgetHeadTilt{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(4deg); } }
  /* A lateral weight-shift, distinct from the lean's pure rotate. */
  @keyframes fidgetShiftWeight{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(2.5px); } }
  /* A quick tug at the sleeve — same small nudge applied to both the arm
     stroke and its hand circle so they move together and stay attached. */
  @keyframes fidgetSweaterAdjust{
    0%,100%{ transform:translate(0,0); }
    40%{ transform:translate(1px,-1.5px); }
    75%{ transform:translate(-0.5px,0); }
  }
  #keeperWrap.fidget-lean{ animation:fidgetLean 1.1s ease-in-out; }
  #keeperWrap.fidget-squish{ animation:fidgetSquish .9s ease-in-out; }
  #head.fidget-tilt{ animation:fidgetHeadTilt 1.3s ease-in-out; transform-origin:50px 50px; }
  #keeperWrap.fidget-shift{ animation:fidgetShiftWeight 1.2s ease-in-out; }
  #armR.fidget-sweater, #handR.fidget-sweater{ animation:fidgetSweaterAdjust .8s ease-in-out; }
  /* Floating "z"s next to the head, shown only while asleep (see setAsleep
     in the script below) — same idea as the sleep visual already designed
     for the Ranah phone app's Keeper. */
  #zzz text{ animation:zzzFloat 2.6s ease-in-out infinite; }
  #zzz text:last-child{ animation-delay:.4s; }
  @keyframes zzzFloat{ 0%,100%{ transform:translateY(0); opacity:.55; } 50%{ transform:translateY(-3px); opacity:.9; } }

  /* The current sky in words ("Partly Cloudy", "Rain"…), centered in the free
     strip above Keeper's head. Absolutely positioned so it never shifts the
     layout the host's click hit-rects are tied to. Stays hidden until the
     sky is actually known (a manual pick, or the first forecast arriving) —
     it must never claim "Clear" just because the page hasn't loaded yet. */
  #skyLabel{
    position:absolute; top:0; left:50%; transform:translateX(-50%); display:none;
    font-size:9px; font-weight:700; line-height:11px; letter-spacing:.04em; white-space:nowrap;
    color:var(--face); pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.55);
  }
  #info{ text-align:center; color:var(--face); margin-top:2px; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.55); }
  #temp{ font-size:19px; font-weight:800; line-height:1; }
  #place{ font-size:10px; opacity:.9; letter-spacing:.02em; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Up to nine possible buttons, though the bar only has room to show
     about seven at once (see MainWindow.xaml.cs's ComputeIconRects) — which
     ones are actually visible is driven by the ?icons= query param the host
     supplies (from the "Icons" menu), toggled below via plain display:none;
     flexbox naturally recenters and closes the gap around whichever subset
     is shown, so no layout math lives here for that part. Click one to ask
     specifically about that thing, rather than guessing at a single
     system-wide "current" session (that turned out to mean "whichever app
     last had media-key focus", not "whatever's actually playing"). Fixed
     position/size otherwise, so nothing else on the stage ever has to
     reflow around it — see MainWindow.xaml.cs's ComputeIconRects, which
     must stay in sync with this layout (icon order, width, gap). left:10px
     (not 0) matches where the separate, genuinely-interactive
     _avatarWindow's hit-testing actually starts (AvatarOffsetX) —
     anchoring here instead of centering across the
     full 150px stage reclaims the margin the old centered layout wasted
     symmetrically on both edges just to keep the left edge inside that hit
     zone, which is exactly the room a 7th icon needed in the first place. */
  #mediaBar{ position:absolute; left:10px; right:0; bottom:42px; height:20px; display:flex; align-items:center; justify-content:center; gap:2px; }
  .mediaIcon{ width:18px; height:18px; border-radius:5px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.4); cursor:pointer; }
  #iconYoutube{ background:#ff0033; }
  #iconYoutube .tri{ width:0; height:0; border-style:solid; border-width:4px 0 4px 6px; border-color:transparent transparent transparent #fff; margin-left:1.5px; }
  #iconSpotify{ background:#1db954; border-radius:50%; color:#fff; font-size:11px; line-height:1; }
  #iconBell{ background:transparent; box-shadow:none; font-size:13px; line-height:1; }
  /* Lists every app currently holding a media session, in case something
     besides YouTube/Spotify is playing — a native popup menu (built and
     shown host-side, see ShowAppPicker in MainWindow.xaml.cs) rather than
     anything drawn on the page, since there's no room here for a real
     search UI. */
  #iconSearch{ background:transparent; box-shadow:none; font-size:13px; line-height:1; }
  /* Shows the system's GPU(s) (via WMI, see GpuInfo.cs) in the same label
     the other icons use — static info, but reusing that mechanism beats
     building a separate one-shot display just for this. */
  #iconGpu{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }
  /* Grabs whatever text is highlighted in whichever app the user was in
     right before clicking this — see TextSelectionReader.cs — shows it in
     the label same as everything else, and has Keeper read it aloud (see
     SpeechReader.cs). A one-shot action, not something that keeps polling
     like the others, since re-simulating Ctrl+C every few seconds into
     whatever now has focus would be actively disruptive. */
  #iconRead{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }
  /* Voice dictation — opens a small text-capture window (see
     DictationCaptureWindow.xaml.cs) and triggers Windows' own Voice Typing
     (Win+H) to type into it, rather than calling WinRT's SpeechRecognizer
     directly (see SpeechToText.cs) — Voice Typing reliably captured real
     audio on the dev machine when SpeechRecognizer did not, and it handles
     its own language switching, so there's no separate Arabic click here.
     Appended to a running text file, so nothing needs copying out by hand. */
  #iconMic{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }
  /* Converts a selected "<number> <unit>" phrase (see UnitConverter.cs) —
     length/weight/temperature, done entirely locally, no network call.
     Opens an editable converter window rather than a one-shot result. */
  #iconConvert{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }
  /* Eyedropper — click, then hover anywhere on screen (not just this
     widget) to see the live hex code under the cursor, click again to copy
     it. Host-driven (see ColorPickerOverlay.xaml.cs — a real fullscreen
     window, since there's no web API for "any pixel on the user's screen,
     even outside the browser"), this icon is just the trigger. */
  #iconColor{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }
  /* Same one-shot pattern as read/convert — grabs the current selection
     and opens a QR code for it (see QrCodeWindow.xaml.cs), so a link on
     the desktop can just be scanned onto a phone with no companion app. */
  #iconQr{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }
  /* A quick toggle, not a one-shot needing a selection — click flips
     system mute and the label briefly shows the result (see
     ToggleVolume in MainWindow.xaml.cs / VolumeControl.cs). */
  #iconVolume{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }
  /* Opens ClipboardHistoryWindow — pulls Windows' own Clipboard History
     fresh on click (see ShowClipboardHistoryAsync in MainWindow.xaml.cs),
     nothing tracked in the background between clicks. */
  #iconClipboard{ background:transparent; box-shadow:none; font-size:12px; line-height:1; }

  /* What the watched app is playing (or the latest notification), sitting
     under the icons — hidden until the host reports something, and left
     showing for as long as it's still relevant (the host only clears it
     once that source actually stops/changes). Title and subtitle (artist,
     or a notification's body) get their own line each, rather than being
     joined into one string — a notification's body especially deserves
     to be legible on its own, not just eventually readable by waiting for
     a shared scroll to come around. */
  #nowPlaying{
    position:absolute; left:3px; right:3px; bottom:4px; height:36px;
    display:none; align-items:flex-start; gap:4px;
    padding:4px 6px; box-sizing:border-box; border-radius:9px;
    background:rgba(0,0,0,.4); color:var(--face);
  }
  #nowPlaying.show{ display:flex; }
  /* The click itself (open the app) is handled host-side, same as the
     icons — this just hints that the label body (not the pause button)
     is a button too. */
  #nowPlaying .note, #nowPlaying .icon, #nowPlaying .lines{ cursor:pointer; }
  #nowPlaying .note{ flex:none; font-size:10px; opacity:.85; margin-top:1px; }
  /* The notification's own app icon, when the host could fetch one — sits
     where .note otherwise would, the two never shown at once. */
  #nowPlaying .icon{ display:none; flex:none; width:15px; height:15px; border-radius:3px; object-fit:cover; margin-top:1px; }
  #nowPlaying .lines{ flex:1; min-width:0; padding-right:26px; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  /* A small explicit font-size (matching the inner span closely enough)
     kills the "strut" that was here before — without it, each line's own
     box reserved height for the page's inherited 16px line-height even
     though the actual text is a smaller-font span inside, which pushed
     the subtitle line mostly below the label's fixed height and made it
     look invisible. font-size:0 alone (tried first) shrank the strut to
     nothing, but clipped the glyphs themselves along with it. */
  #nowPlaying .titleLine, #nowPlaying .subtitleLine{ overflow:hidden; white-space:nowrap; font-size:10px; line-height:1.25; -webkit-mask-image:linear-gradient(to right, transparent, #000 6px, #000 calc(100% - 6px), transparent); mask-image:linear-gradient(to right, transparent, #000 6px, #000 calc(100% - 6px), transparent); }
  #nowPlaying .titleLine span{ display:inline-block; font-size:11px; font-weight:600; letter-spacing:.01em; }
  #nowPlaying .subtitleLine span{ display:inline-block; font-size:9.5px; opacity:.8; letter-spacing:.01em; }
  #nowPlaying .titleLine.scroll span, #nowPlaying .subtitleLine.scroll span{ animation:marquee 7s linear infinite; }
  @keyframes marquee{ 0%{ transform:translateX(100%); } 100%{ transform:translateX(-100%); } }
  /* Stops watching immediately instead of waiting for the source to
     actually stop on its own — see PauseIconRect in MainWindow.xaml.cs,
     which must stay in sync with this position. Pinned to a fixed spot
     (not just "last flex item") now that .list sits beside it, so
     neither one's position depends on the other being present. */
  #nowPlaying .pause{ position:absolute; right:6px; top:5px; width:11px; height:11px; opacity:.8; font-size:10px; line-height:1; cursor:pointer; }
  /* Opens Windows' own notification flyout (the full list) — only shown
     while watching notifications, since media has no such list. See
     ListIconRect in MainWindow.xaml.cs, which must stay in sync. */
  #nowPlaying .list{ display:none; position:absolute; right:21px; top:5px; width:11px; height:11px; opacity:.8; font-size:9px; line-height:1; cursor:pointer; }
  #nowPlaying.notif .list{ display:block; }

  /* Battery status — top-left, the mirror spot of the sky icon (sun/cloud/
     moon, all top-right below). Hidden entirely rather than showing a
     meaningless reading when the host has no battery (a desktop PC) — see
     BatteryInfo.cs, which reports null in that case. */
  #battery{
    position:absolute; top:15px; left:8px; display:none;
    flex-direction:column; align-items:flex-start; gap:1px; color:var(--face);
    text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.55);
    font-size:10px; font-weight:700; letter-spacing:.02em;
  }
  #battery.show{ display:flex; }
  #battery .batteryRow{ display:flex; align-items:center; gap:3px; }
  #battery .icon{ position:relative; width:15px; height:8px; border:1.2px solid var(--face); border-radius:2px; box-sizing:border-box; flex:none; }
  #battery .icon::after{ content:''; position:absolute; right:-3px; top:2px; width:1.5px; height:3px; background:var(--face); border-radius:0 1px 1px 0; }
  #battery .fill{ position:absolute; left:1px; top:1px; bottom:1px; width:2px; border-radius:1px; background:var(--face); }
  #battery.charging .fill{ background:var(--highlight); }
  #battery.low .fill{ background:#e2665c; }
  #battery .bolt{ display:none; font-size:9px; line-height:1; }
  #battery.charging .bolt{ display:inline; }
  /* Only shown while actually discharging with a known estimate — Windows
     doesn't expose a time-to-full while charging, so there's nothing
     truthful to put here in that state (see BatteryInfo.cs). */
  #batteryTime{ display:none; font-size:8.5px; font-weight:600; opacity:.85; letter-spacing:.01em; padding-left:1px; }
  #battery.hasTime #batteryTime{ display:block; }

  /* Sun rays, shown behind the keeper on clear days. */
  .sun{ position:absolute; top:14px; right:10px; width:26px; height:26px; display:none; }
  body.sky-clear .sun{ display:block; }
  .sun .core{ position:absolute; left:8px; top:8px; width:10px; height:10px; border-radius:50%; background:var(--highlight); box-shadow:0 0 10px 2px var(--highlight); }
  .sun .ray{ position:absolute; left:12px; top:12px; width:2px; height:6px; background:var(--highlight); border-radius:1px; transform-origin:1px 13px; opacity:.85; }

  /* Same spot as .sun (so swapping between them causes no layout shift) —
     shown instead of it once is_day (from the API, see refreshWeather)
     says it's actually night, rather than a plain sun regardless of the
     hour. A full pale disc with a couple of craters reads as "moon" more
     reliably than attempting a true crescent cutout would, since the
     stage has no solid background color to mask a bite out of. */
  .moon{ position:absolute; top:14px; right:10px; width:26px; height:26px; display:none; }
  body.sky-clear.is-night .moon{ display:block; }
  body.sky-clear.is-night .sun{ display:none; }
  .moon .disc{ position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#eef1f8; box-shadow:0 0 8px 2px rgba(238,241,248,.55); }
  .moon .crater{ position:absolute; border-radius:50%; background:#cfd6e4; opacity:.7; }
  .moon .crater1{ left:6px; top:8px; width:4px; height:4px; }
  .moon .crater2{ left:12px; top:14px; width:3px; height:3px; }
  .moon .crater3{ left:14px; top:6px; width:2px; height:2px; }
  .moon .star{ position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:.85; animation:twinkle 2.4s ease-in-out infinite; }
  .moon .star1{ left:-6px; top:2px; animation-delay:0s; }
  .moon .star2{ left:24px; top:16px; animation-delay:1.1s; }
  @keyframes twinkle{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  /* The mostly-cloudy icon's peeking sun turns a pale moon-white at night
     instead — cheaper and more consistent than duplicating its markup with
     a separate peekMoon element just to swap a color. */
  body.is-night .cloudMostly .peekSun{ background:#eef1f8; box-shadow:0 0 8px 1px rgba(238,241,248,.5); }

  /* A drifting cloud, shown instead of the sun on partly-cloudy days. */
  .cloud{ position:absolute; top:16px; right:6px; width:46px; height:22px; display:none; animation:drift 6s ease-in-out infinite; }
  body.sky-cloudy .cloud{ display:block; }
  .cloud .puff{ position:absolute; bottom:5px; border-radius:50%; background:#dfe6ee; opacity:.92; }
  .cloud .puff1{ left:0; width:16px; height:16px; }
  .cloud .puff2{ left:12px; bottom:8px; width:20px; height:20px; }
  .cloud .puff3{ left:28px; width:14px; height:14px; }
  .cloud .base{ position:absolute; left:4px; bottom:0; width:38px; height:14px; border-radius:8px; background:#dfe6ee; opacity:.92; }
  @keyframes drift{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-4px); } }

  /* Windows' own "mostly cloudy" icon is a sun peeking out from behind a
     cloud, not a solid cloud mass — matching that instead of inventing a
     different visual language for the same condition. */
  .cloudMostly{ position:absolute; top:10px; right:2px; width:58px; height:32px; display:none; animation:drift 7s ease-in-out infinite; }
  body.sky-mostlycloudy .cloudMostly{ display:block; }
  .cloudMostly .peekSun{ position:absolute; left:0; top:0; width:20px; height:20px; border-radius:50%; background:var(--highlight); box-shadow:0 0 9px 2px var(--highlight); }
  .cloudMostly .puff{ position:absolute; bottom:4px; border-radius:50%; background:#e9edf1; opacity:.96; }
  .cloudMostly .puff1{ left:10px; width:20px; height:20px; }
  .cloudMostly .puff2{ left:24px; bottom:8px; width:24px; height:24px; }
  .cloudMostly .puff3{ left:42px; width:15px; height:15px; }
  .cloudMostly .base{ position:absolute; left:8px; bottom:0; width:44px; height:15px; border-radius:8px; background:#e9edf1; opacity:.96; }

  /* Heaviest non-precipitating cloud cover — same shape family as
     .cloudMostly (same safe width/position, already tuned to avoid
     clipping at the stage's right edge) but with no sun peeking through
     at all, and a darker grey so it reads as denser than either lighter
     state rather than just "the mostly-cloudy icon with the sun removed". */
  .cloudOvercast{ position:absolute; top:12px; right:2px; width:58px; height:30px; display:none; animation:drift 8s ease-in-out infinite; }
  body.sky-overcast .cloudOvercast{ display:block; }
  .cloudOvercast .puff{ position:absolute; bottom:4px; border-radius:50%; background:#b9c2cc; opacity:.96; }
  .cloudOvercast .puff1{ left:6px; width:20px; height:20px; }
  .cloudOvercast .puff2{ left:20px; bottom:7px; width:24px; height:24px; }
  .cloudOvercast .puff3{ left:38px; width:16px; height:16px; }
  .cloudOvercast .base{ position:absolute; left:4px; bottom:0; width:50px; height:16px; border-radius:8px; background:#b9c2cc; opacity:.96; }

  /* A few falling streaks/dots — a light touch of the app's own weather layer. */
  .drop{ position:absolute; width:2px; height:12px; border-radius:1px; background:#cfe3f7; opacity:0; top:-14px; }
  body.sky-rain .drop, body.sky-storm .drop{ opacity:.75; animation:fall linear infinite; }
  /* Lighter, slower, more transparent than rain's drops — same element,
     just dialled down. animation-duration needs !important since each
     .drop already sets its own inline duration for rain/storm's varied
     timing. */
  body.sky-drizzle .drop{ opacity:.4; width:1.5px; height:7px; animation:fall linear infinite; animation-duration:1.9s !important; }
  .flake{ position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; opacity:0; top:-8px; }
  body.sky-snow .flake{ opacity:.85; animation:fallSlow linear infinite; }
  @keyframes fall{ 0%{ transform:translateY(-14px); } 100%{ transform:translateY(214px); } }
  @keyframes fallSlow{ 0%{ transform:translate(0,-8px); } 50%{ transform:translate(6px,100px); } 100%{ transform:translate(-4px,214px); } }

  body.sky-storm #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  body.sky-storm #flash.on{ animation:flash .5s ease-out; }
  @keyframes flash{ 0%{ opacity:.55; } 100%{ opacity:0; } }

  /* A low haze that rolls in over everything, thickest near the ground.
     backdrop-filter can't reach the real desktop behind a transparent
     window (there's nothing of the page's own behind it to blur), so this
     is a plain white wash instead — opaque enough to still read as fog
     over a similarly pale desktop background, not just a dark one. */
  #fog{ position:absolute; inset:0; opacity:0; pointer-events:none; overflow:hidden; transition:opacity .4s; }
  body.sky-fog #fog{ opacity:1; }
  #fog::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(255,255,255,.85), rgba(255,255,255,.5) 45%, rgba(255,255,255,.08) 78%);
  }
  #fog .wisp{ position:absolute; left:-25%; width:150%; height:9px; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(2px); animation:driftWisp ease-in-out infinite; }
  @keyframes driftWisp{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(16px); } }

  /* Leaves blown across the stage, left to right, tumbling as they go. */
  .leaf{ position:absolute; left:-10px; width:6px; height:4px; border-radius:50% 50% 50% 0; background:#c98a3b; opacity:0; }
  body.sky-windy .leaf{ animation:gust linear infinite; }
  @keyframes gust{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    8%{ opacity:.9; }
    92%{ opacity:.9; }
    100%{ transform:translate(172px,14px) rotate(340deg); opacity:0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="sparkle">
      <div id="flash"></div>

      <div class="mediaIcon" id="iconBell" title="Latest notification">🔔</div>
      <div class="mediaIcon" id="iconSearch" title="Other apps playing media">🔍</div>

      <div class="mediaIcon" id="iconRead" title="Read selected text aloud">🗣️</div>

      <div class="mediaIcon" id="iconConvert" title="Convert selected unit">💱</div>
      <div class="mediaIcon" id="iconColor" title="Pick a color from the screen">🎨</div>
      <div class="mediaIcon" id="iconQr" title="QR code from selected text/link">📱</div>

      <span class="note" id="nowPlayingNote">♪</span>
      <img class="icon" id="nowPlayingIcon" alt="" />
      <div class="lines">
        <div class="titleLine"><span id="nowPlayingTitle"></span></div>
        <div class="subtitleLine"><span id="nowPlayingSubtitle"></span></div>
      </div>
      <span class="list" title="Show notification list">☰</span>
      <span class="pause" title="Stop watching">⏸</span>
    </div>

<script>
  // Dragging, double-click and right-click are all handled natively by a
  // separate, invisible WPF window the host places on top of the avatar —
  // this page itself is purely decorative and never receives mouse input.

  // ---- now playing / latest notification: the icon click itself is
  // handled host-side (see YoutubeIconRect/SpotifyIconRect/BellIconRect +
  // WatchApp/WatchNotifications in MainWindow.xaml.cs — WebView2 never
  // gets mouse input here at all), which then polls that source and
  // pushes updates here as it changes ----
  const nowPlayingEl = document.getElementById('nowPlaying');
  const titleTextEl = document.getElementById('nowPlayingTitle');
  const subtitleTextEl = document.getElementById('nowPlayingSubtitle');
  const titleLineEl = document.querySelector('#nowPlaying .titleLine');
  const subtitleLineEl = document.querySelector('#nowPlaying .subtitleLine');
  const noteEl = document.getElementById('nowPlayingNote');
  const iconEl = document.getElementById('nowPlayingIcon');

  function fitLine(textEl, lineEl) {
    lineEl.classList.remove('scroll');
    requestAnimationFrame(() => {
      if (textEl.scrollWidth > lineEl.clientWidth) lineEl.classList.add('scroll');
    });
  }

  window.chrome?.webview?.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.type !== 'nowPlaying') return;

    if (!msg.title) {
      nowPlayingEl.classList.remove('show');
      return;
    }
    titleTextEl.textContent = msg.title;
    subtitleTextEl.textContent = msg.artist || '';
    subtitleLineEl.style.display = msg.artist ? '' : 'none';
    // The notification's own app icon when there is one (media never has
    // one) — falls back to the plain note glyph otherwise, e.g. if the
    // host couldn't fetch a logo for that particular app.
    if (msg.icon) {
      iconEl.src = msg.icon;
      iconEl.style.display = 'block';
      noteEl.style.display = 'none';
    } else {
      iconEl.style.display = 'none';
      noteEl.style.display = '';
    }
    nowPlayingEl.classList.toggle('notif', !!msg.isNotification);
    nowPlayingEl.classList.add('show');

    // Only scroll a line if it actually overflows — a short one just sits still.
    fitLine(titleTextEl, titleLineEl);
    if (msg.artist) fitLine(subtitleTextEl, subtitleLineEl);
  });

  // ---- battery: percentage, charging state, time remaining — pushed by
  // the host on a slow timer (see RefreshBattery in MainWindow.xaml.cs),
  // same PostWebMessageAsJson channel as now-playing above ----
  const batteryEl = document.getElementById('battery');
  const batteryFillEl = document.querySelector('#battery .fill');
  const batteryPercentEl = document.getElementById('batteryPercent');
  const batteryTimeEl = document.getElementById('batteryTime');
  const BATTERY_FILL_MAX = 11; // inner width of the .icon glyph, in px

  window.chrome?.webview?.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.type !== 'battery') return;

    if (msg.percent == null) {
      batteryEl.classList.remove('show');
      return;
    }

    batteryPercentEl.textContent = Math.round(msg.percent) + '%';
    batteryFillEl.style.width = Math.max(1, Math.round(msg.percent / 100 * BATTERY_FILL_MAX)) + 'px';
    batteryEl.classList.toggle('charging', !!msg.charging);
    batteryEl.classList.toggle('low', msg.percent <= 15 && !msg.charging);
    batteryEl.classList.toggle('hasTime', !!msg.timeRemaining);
    batteryTimeEl.textContent = msg.timeRemaining ? `${msg.timeRemaining} left` : '';
    batteryEl.title = msg.charging
      ? 'Charging'
      : (msg.timeRemaining ? `${msg.timeRemaining} remaining` : `${Math.round(msg.percent)}% battery`);
    batteryEl.classList.add('show');
  });

  // ---- blink, purely decorative ----
  const eyesOpen = document.getElementById('eyesOpen');
  const eyesClosed = document.getElementById('eyesClosed');
  let activityState = 'awake'; // set by setActivityState below — blink
                                // skips touching the eyes while asleep
                                // rather than fighting the closed state
                                // setActivityState already forced.
  function scheduleBlink() {
    const wait = 2400 + Math.random() * 2800;
    setTimeout(() => {
      if (activityState !== 'asleep') {
        eyesOpen.style.display = 'none';
        eyesClosed.style.display = '';
      }
      setTimeout(() => {
        if (activityState !== 'asleep') {
          eyesOpen.style.display = '';
          eyesClosed.style.display = 'none';
        }
        scheduleBlink();
      }, 140);
    }, wait);
  }
  scheduleBlink();

  // ---- activity state: awake / asleep / workout — the host measures
  // system-wide idle time and how long it's been since the last real break
  // (see UpdateActivityState in MainWindow.xaml.cs) and just tells this
  // page which one applies; nothing is tracked here. Purely cosmetic:
  // every icon still works exactly the same in any state. ----
  const mouthAwake = document.getElementById('mouthAwake');
  const mouthSleep = document.getElementById('mouthSleep');
  const mouthWorkout = document.getElementById('mouthWorkout');
  const zzzEl = document.getElementById('zzz');
  const armL = document.getElementById('armL');
  const armR = document.getElementById('armR');
  const handL = document.getElementById('handL');
  const handR = document.getElementById('handR');
  const workoutArms = document.getElementById('workoutArms');
  const workoutCountdownEl = document.getElementById('workoutCountdown');

  function setActivityState(state, secondsLeft) {
    if (state !== activityState) {
      activityState = state;
      const sleeping = state === 'asleep';
      const working = state === 'workout';

      document.body.classList.toggle('sleeping', sleeping);
      document.body.classList.toggle('working-out', working);

      mouthAwake.style.display = (sleeping || working) ? 'none' : '';
      mouthSleep.style.display = sleeping ? '' : 'none';
      mouthWorkout.style.display = working ? '' : 'none';
      zzzEl.style.display = sleeping ? '' : 'none';
      eyesOpen.style.display = sleeping ? 'none' : '';
      eyesClosed.style.display = sleeping ? '' : 'none';
      armL.style.display = working ? 'none' : '';
      armR.style.display = working ? 'none' : '';
      handL.style.display = working ? 'none' : '';
      handR.style.display = working ? 'none' : '';
      workoutArms.style.display = working ? '' : 'none';
      workoutCountdownEl.style.display = working ? '' : 'none';
    }

    // Updated every tick while working out, even though the state itself
    // hasn't changed — this is the part that actually counts down.
    if (state === 'workout' && typeof secondsLeft === 'number') {
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      workoutCountdownEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
    }
  }
  window.chrome?.webview?.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.type !== 'activity') return;
    setActivityState(msg.state, msg.secondsLeft);
  });

  // ---- perk-up: a one-shot bounce the moment Watch() starts on the host
  // side (see PushPerk in MainWindow.xaml.cs), and idle fidgets: a small
  // pool of rare, random micro-animations while just standing there. Both
  // share one "is #keeperWrap already mid-animation" guard so they don't
  // silently stomp each other — a low-stakes collision either way, but
  // cheap to avoid. ----
  const keeperWrapEl = document.getElementById('keeperWrap');
  const headEl = document.getElementById('head');
  let wrapBusy = false;

  function perk() {
    if (activityState !== 'awake' || wrapBusy) return;
    wrapBusy = true;
    keeperWrapEl.classList.add('perk');
    setTimeout(() => { keeperWrapEl.classList.remove('perk'); wrapBusy = false; }, 500);
  }
  window.chrome?.webview?.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || msg.type !== 'perk') return;
    perk();
  });

  const armREl = document.getElementById('armR');
  // els is an array so a fidget can move more than one part together (the
  // sweater-tug needs the arm stroke and its hand circle to move as one,
  // or they'd visibly separate) — every fidget uses the same shape even
  // when it only touches a single element.
  const FIDGETS = [
    { els: [keeperWrapEl], cls: 'fidget-lean', duration: 1100, locksWrap: true },
    { els: [keeperWrapEl], cls: 'fidget-squish', duration: 900, locksWrap: true },
    { els: [headEl], cls: 'fidget-tilt', duration: 1300, locksWrap: false },
    { els: [keeperWrapEl], cls: 'fidget-shift', duration: 1200, locksWrap: true },
    { els: [armREl, handR], cls: 'fidget-sweater', duration: 800, locksWrap: false },
  ];
  function scheduleFidget() {
    const wait = 15000 + Math.random() * 25000; // 15–40s, sparse on purpose
    setTimeout(() => {
      if (activityState === 'awake' && !wrapBusy) {
        const pick = FIDGETS[Math.floor(Math.random() * FIDGETS.length)];
        if (pick.locksWrap) wrapBusy = true;
        for (const el of pick.els) el.classList.add(pick.cls);
        setTimeout(() => {
          for (const el of pick.els) el.classList.remove(pick.cls);
          if (pick.locksWrap) wrapBusy = false;
        }, pick.duration);
      }
      scheduleFidget();
    }, wait);
  }
  scheduleFidget();

  // ---- lightning flash, storm only ----
  function scheduleFlash() {
    const wait = 1800 + Math.random() * 3200;
    setTimeout(() => {
      const flash = document.getElementById('flash');
      if (document.body.classList.contains('sky-storm')) {
        flash.classList.remove('on');
        void flash.offsetWidth;
        flash.classList.add('on');
      }
      scheduleFlash();
    }, wait);
  }
  scheduleFlash();

  // ---- sun rays (drawn once) ----
  const sun = document.querySelector('.sun');
  for (let i = 0; i < 8; i++) {
    const ray = document.createElement('div');
    ray.className = 'ray';
    ray.style.transform = `rotate(${(360 / 8) * i}deg)`;
    sun.appendChild(ray);
  }

  // ---- weather state -> which parts of the keeper show ----
  const groups = ['torsoRain', 'torsoSnowExtra', 'torsoStorm', 'raincoatHoodBack', 'raincoatHood', 'snowHat', 'sunglasses', 'umbrellaHeld', 'umbrellaLeaning'];
  function show(id, on) { document.getElementById(id).style.display = on ? '' : 'none'; }

  function applyWeather(kind) {
    document.body.classList.remove('sky-clear', 'sky-cloudy', 'sky-mostlycloudy', 'sky-overcast', 'sky-windy', 'sky-fog', 'sky-drizzle', 'sky-rain', 'sky-snow', 'sky-storm');
    document.body.classList.add('sky-' + kind);
    groups.forEach((id) => show(id, false));

    const armColor =
      kind === 'rain' ? '#e2b640' : kind === 'storm' ? 'var(--body1)' : 'var(--sweater)';
    document.getElementById('armL').setAttribute('stroke', armColor);
    document.getElementById('armR').setAttribute('stroke', armColor);

    if (kind === 'rain') {
      show('torsoRain', true);
      show('raincoatHoodBack', true);
      show('raincoatHood', true);
      show('umbrellaHeld', true);
    } else if (kind === 'drizzle') {
      // Light enough that the hood alone is enough — no full raincoat,
      // no umbrella, unlike proper rain.
      show('raincoatHoodBack', true);
      show('raincoatHood', true);
    } else if (kind === 'snow') {
      show('torsoSnowExtra', true);
      show('snowHat', true);
    } else if (kind === 'storm') {
      show('torsoStorm', true);
    } else if (kind === 'clear') {
      show('sunglasses', true);
    }
    // cloudy/mostlycloudy/overcast/fog/windy: default torso, no sunglasses (no direct sun)
  }
  // ---- live weather, from the query string CloClo's WPF host supplies ----
  const params = new URLSearchParams(location.search);
  const lat = params.get('lat');
  const lon = params.get('lon');
  const place = params.get('city') || '';
  document.getElementById('place').textContent = place;

  // Which media-bar icons to show — driven by the "Icons" menu host-side
  // (see WidgetSettings.EnabledIcons), not decided here. Hiding the rest
  // via plain display:none lets flexbox recenter/close the gap on its own.
  const iconIdByKey = {
    youtube: 'iconYoutube', spotify: 'iconSpotify', bell: 'iconBell',
    search: 'iconSearch', gpu: 'iconGpu', read: 'iconRead', mic: 'iconMic',
    convert: 'iconConvert', color: 'iconColor', qr: 'iconQr', volume: 'iconVolume',
    clipboard: 'iconClipboard',
  };
  const enabledIcons = (params.get('icons') || 'youtube,spotify,bell,search,gpu,read,mic').split(',');
  for (const [key, id] of Object.entries(iconIdByKey)) {
    const el = document.getElementById(id);
    if (el) el.style.display = enabledIcons.includes(key) ? '' : 'none';
  }

  // "auto" follows the real forecast below; anything else is a manual pick
  // from the right-click menu, which wins over whatever the forecast says —
  // the temperature and location still update live either way.
  const skyOverride = params.get('sky') || 'auto';

  // Same wording as the right-click Weather menu (SkyOptions in
  // MainWindow.xaml.cs), so the label and the menu never disagree.
  const SKY_LABELS = {
    clear: 'Clear', cloudy: 'Partly Cloudy', mostlycloudy: 'Mostly Cloudy', overcast: 'Cloudy',
    windy: 'Windy', fog: 'Fog', drizzle: 'Drizzle', rain: 'Rain', snow: 'Snow', storm: 'Storm',
  };
  function showSkyLabel(kind) {
    const el = document.getElementById('skyLabel');
    el.textContent = SKY_LABELS[kind] || '';
    el.style.display = SKY_LABELS[kind] ? 'block' : 'none';
  }

  if (skyOverride !== 'auto') { applyWeather(skyOverride); showSkyLabel(skyOverride); }
  else applyWeather('clear');

  // Cloud cover is a continuous 0-100% reading from the API, banded here
  // into four visual steps — clear/partly cloudy/mostly cloudy/overcast —
  // rather than relying on the weather code's own cloud buckets (0/1/2/3),
  // which are too coarse to tell "partly cloudy" from "overcast but not
  // actually raining" apart. The weather code is still what picks
  // precipitation/fog, since cloud cover alone can't tell "cloudy" from
  // "cloudy and also raining".
  function cloudCoverToSky(cloudCover) {
    if (cloudCover < 20) return 'clear';
    if (cloudCover < 45) return 'cloudy'; // partly cloudy
    if (cloudCover < 75) return 'mostlycloudy';
    return 'overcast';
  }

  function codeToSky(code, cloudCover) {
    if ([51, 53, 55, 56, 57].includes(code)) return 'drizzle';
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return 'rain';
    if ([71, 73, 75, 77, 85, 86].includes(code)) return 'snow';
    if ([95, 96, 99].includes(code)) return 'storm';
    if ([45, 48].includes(code)) return 'fog';
    return cloudCoverToSky(cloudCover);
  }

  // Wind only gets its own visual when it's the most notable thing
  // happening — under a plain or overcast sky. Rain/snow/storm/fog already
  // read as "bad weather" on their own, so a gust on top of them would
  // just be visual noise without a blended animation to show it properly.
  const WINDY_THRESHOLD_KMH = 28;

  async function refreshWeather() {
    if (!lat || !lon) return;
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,cloud_cover,is_day&timezone=auto`;
      const res = await fetch(url);
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const code = data.current.weather_code;
      const windSpeed = data.current.wind_speed_10m;
      const cloudCover = data.current.cloud_cover;
      document.getElementById('temp').textContent = `${temp}°`;
      // Applied unconditionally (not just when skyOverride === 'auto') so a
      // manually-picked sky still shows the right sun/moon for the actual
      // time of day, rather than day/night only working in auto mode.
      document.body.classList.toggle('is-night', data.current.is_day === 0);
      if (skyOverride === 'auto') {
        let sky = codeToSky(code, cloudCover);
        if ((sky === 'clear' || sky === 'cloudy' || sky === 'mostlycloudy' || sky === 'overcast') && windSpeed >= WINDY_THRESHOLD_KMH) sky = 'windy';
        applyWeather(sky);
        showSkyLabel(sky);
      }
    } catch (err) {
      document.getElementById('temp').textContent = '—°';
    }
  }
  refreshWeather();
  setInterval(refreshWeather, 20 * 60 * 1000);
</script>
</body>
</html>
